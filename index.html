<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Mystic Hand Magic</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <video id="cam" playsinline muted autoplay></video>

    <div id="hint" class="hint hidden">ক্যামেরার সামনে হাত ধরো</div>
    <div id="debug" class="debug hidden"></div>

    <div id="hud" class="hud hidden">
      <button id="btnFlip" aria-label="flip camera">
        <svg viewBox="0 0 24 24"><path d="M20 7h-3.2L15 5H9L7.2 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14.5 9.5v1.8h-1.8M9.5 16.5v-1.8h1.8"/></svg>
      </button>
      <button id="btnMute" aria-label="sound">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg>
      </button>
      <button id="btnFs" aria-label="fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div id="splash" class="splash">
      <div class="splash-inner">
        <h1>Mystic Hand Magic</h1>
        <p>ক্যামেরার সামনে হাত ধরো। খোলা হাতে সার্কেল, এক আঙুলে আগুনের রেখা, মুঠো করলে বিস্ফোরণ।</p>
        <button id="start" class="cta">Start</button>
        <p id="status" class="status" role="status"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
